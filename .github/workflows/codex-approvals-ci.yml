name: Codex approval bridge offline checks

on:
  pull_request:
    paths:
      - "src/codex_*.py"
      - "src/approval_portal.py"
      - "src/mcp_adapter.py"
      - "src/mcp_http_transport.py"
      - "src/pipeline_policy_migration.py"
      - "tests/test_codex_approval_bridge.py"
      - "tests/test_approval_portal.py"
      - "tests/test_codex_schema_compatibility.py"
      - "tests/fixtures/codex-0.167-contract.json"
      - "docs/approval-bridge.md"
      - "docs/approval-portal-mvp.md"
      - "docs/approval-host-options.md"
      - ".github/workflows/codex-approvals-ci.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run bounded approval, transport and schema regressions
        env:
          PYTHONPATH: tests
        run: >-
          python3 -B -m unittest
          test_codex_approval_bridge test_approval_portal test_codex_schema_compatibility
          test_pipeline_foundation_isolated test_codex_pipeline_adapter_extract
          test_mcp_http_transport -v
      - name: Check Python syntax
        run: >-
          python3 -m py_compile src/codex_approvals.py src/codex_pipeline.py
          src/codex_app_protocol.py src/codex_host.py src/mcp_adapter.py
          src/pipeline_policy_migration.py src/approval_portal.py src/mcp_http_transport.py
