name: Native agent team

on:
  pull_request:
    paths:
      - '.codex/**'
      - 'config/native-team.json'
      - 'src/native_*.py'
      - 'scripts/native_*.py'
      - 'scripts/native_thread_capture.cjs'
      - 'scripts/plan_native_team.py'
      - 'scripts/check_source_ascii.py'
      - 'scripts/git_audit.py'
      - 'tests/test_git_audit.py'
      - 'tests/test_source_ascii.py'
      - 'tests/test_native_*.py'
      - 'tests/native_thread_capture.cjs'
      - '.github/workflows/native-team-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Native roles and parent handoff (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Verify role selection, explicit models, leases, and immutable handoff
        env:
          PYTHONPATH: tests
        run: >-
          python3 -B -m unittest
          test_native_agent_profiles test_native_team test_native_dispatcher
          test_native_parent_adapter test_native_handoff test_source_ascii test_git_audit -v
      - name: Verify fixed JavaScript capture helpers without models
        run: node --test tests/native_thread_capture.cjs
      - name: Inspect a non-executing role recommendation
        run: >-
          python3 -B scripts/plan_native_team.py
          --purpose implementation --complexity advanced
          --parallel-parts 3 --security-sensitive
